# CodeBuild buildspec for API Lambda CD (Q-I15=D)
#
# 動作: GitHub develop branch push → CodePipeline Source → CodeBuild
#       → docker buildx build (linux/arm64) → ECR push → lambda update-function-code
#
# 期待される env vars (CodeBuild project で設定済み):
#   AWS_DEFAULT_REGION:   ap-northeast-1
#   ECR_REPOSITORY_URI:   <account>.dkr.ecr.ap-northeast-1.amazonaws.com/gp-dev-api-image
#   LAMBDA_FUNCTION_NAME: gp-dev-api-fn

version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REPOSITORY_URI
      # CodeBuild standard:7.0 は /bin/sh (dash) でコマンドを実行するため、
      # bash 拡張の ${VAR:0:7} (部分文字列) は "Bad substitution" になる。
      # POSIX 互換の cut で先頭 7 文字を取得する。
      - IMAGE_TAG=$(echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c1-7)
      - echo "Image tag is $IMAGE_TAG"
  build:
    commands:
      - echo Building Docker image (linux/arm64)...
      - docker buildx create --use
      - docker buildx build --platform linux/arm64 --load
        -t $ECR_REPOSITORY_URI:$IMAGE_TAG
        -t $ECR_REPOSITORY_URI:latest
        -f apps/api/Dockerfile apps/api/
  post_build:
    commands:
      - echo Pushing Docker image...
      - docker push $ECR_REPOSITORY_URI:$IMAGE_TAG
      - docker push $ECR_REPOSITORY_URI:latest
      - echo Updating Lambda function...
      # NOTE: 本 MVP では --publish (バージョン publish) や alias 更新を行わない。
      # 本番化時は以下を導入する予定 (envs/prd/README.md の productization):
      #   - aws lambda update-function-code ... --publish (新バージョン番号取得)
      #   - aws lambda update-alias --function-name ... --name live --function-version <ver>
      #     で alias を切替えて blue/green / rollback を可能にする
      - aws lambda update-function-code
        --function-name $LAMBDA_FUNCTION_NAME
        --image-uri $ECR_REPOSITORY_URI:$IMAGE_TAG
        --region $AWS_DEFAULT_REGION
      - echo Done
