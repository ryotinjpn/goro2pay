version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - echo "API_ENDPOINT=$API_ENDPOINT" >> .env.production
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
