# Amplify Hosting build spec (monorepo)
# 公式仕様: https://docs.aws.amazon.com/amplify/latest/userguide/monorepo-configuration.html
#
# AMPLIFY_MONOREPO_APP_ROOT (= "web") は Terraform 側で
# `aws_amplify_app.web.environment_variables` (App-level) として注入される
# (infra/modules/amplify/amplify.tf 参照)。本ファイルの appRoot: web と
# 一致させて初めて Amplify がリポジトリの web/ サブディレクトリで build する。
# App-level に置く理由: framework auto-detection は clone 直後 (build phase
# より前) に動き、この段階では Branch-level の env var は読まれないため。
#
# Infra と Frontend で同一内容の amplify.yml を持つ。Infra 側のテスト fixture
# (modules/amplify/tests/fixtures/amplify.yml) も同期しておくこと。
version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            # Amplify Hosting (Next.js SSR) は Branch env vars を build container にしか
            # 注入しない。NEXT_PUBLIC_* 以外を SSR runtime で読むには .env.production に
            # 書き出して next build にバンドルさせる必要がある。
            # 参考: https://docs.aws.amazon.com/amplify/latest/userguide/ssr-environment-variables.html
            - echo "API_ENDPOINT=$API_ENDPOINT" >> .env.production
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
